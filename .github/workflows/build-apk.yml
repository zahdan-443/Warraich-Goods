name: Android APK Build & Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: Configure Android SDK Environment (Android 35)
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run Test Suite
        run: |
          npm run test

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android
          # Safety cleanup: remove any obsolete or duplicate MainActivity files outside official package
          find android/app/src/main/java -name "MainActivity.java" ! -path "*/com/warraichgoods/driverdost/*" -delete || true
          # Safety cleanup: remove any corrupt/non-standard land-hdpi splash that can fail aapt2 compilation
          rm -rf android/app/src/main/res/drawable-land-hdpi || true
          # Asset Hygiene: Purge web-only server, service worker, 404, and screenshots from mobile APK assets
          rm -f android/app/src/main/assets/public/server.cjs* android/app/src/main/assets/public/sw.js* android/app/src/main/assets/public/registerSW.js || true
          rm -f android/app/src/main/assets/public/404.html android/app/src/main/assets/public/sitemap.xml android/app/src/main/assets/public/robots.txt || true
          rm -f android/app/src/main/assets/public/screenshot*.png android/app/src/main/assets/public/dashcam-icon.png android/app/src/main/assets/public/dashcam-icon.jpg || true
          rm -rf android/app/src/main/assets/public/assets/aistudio || true
          # Final post-sync sweep: Ensure zero forbidden domains exist in android/app/src/main/assets/public
          node -e "
            const fs = require('fs');
            const path = require('path');
            function clean(dir) {
              if (!fs.existsSync(dir)) return;
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) clean(p);
                else if (/\.(js|html|css|json)$/i.test(e.name)) {
                  let c = fs.readFileSync(p, 'utf8');
                  let m = false;
                  if (c.includes('cdn.jsdelivr.net')) {
                    c = c.replace(/https?:\/\/cdn\.jsdelivr\.net/g, 'https://offline-bundled.local').replace(/cdn\.jsdelivr\.net/g, 'offline-bundled.local');
                    m = true;
                  }
                  if (c.includes('api.qrserver.com')) {
                    c = c.replace(/https?:\/\/api\.qrserver\.com/g, 'https://offline-qr.local').replace(/api\.qrserver\.com/g, 'offline-qr.local');
                    m = true;
                  }
                  if (c.includes('your-backend-api.com')) {
                    c = c.replace(/your-backend-api\.com/g, 'api.example.com');
                    m = true;
                  }
                  if (m) fs.writeFileSync(p, c);
                }
              }
            }
            clean('android/app/src/main/assets/public');
            console.log('✅ Post-sync sweep verified zero forbidden domains in android assets');
          "

      - name: Configure google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app/src/release android/app/src/debug
          node -e "
            const fs = require('fs');
            const content = (process.env.GOOGLE_SERVICES_JSON || '').trim();
            if (content.startsWith('{')) {
              fs.writeFileSync('android/app/google-services.json', content);
              fs.writeFileSync('android/app/src/release/google-services.json', content);
              console.log('✅ Injected google-services.json from GitHub Secrets');
            } else if (fs.existsSync('android/app/google-services.json')) {
              console.log('✅ Using repository android/app/google-services.json');
            }
          " || true
          # Guarantee file is synced to all build variants
          if [ -f "android/app/google-services.json" ]; then
            cp -f android/app/google-services.json android/app/src/release/google-services.json 2>/dev/null || true
            cp -f android/app/google-services.json android/app/src/debug/google-services.json 2>/dev/null || true
          fi

      - name: Prepare Release Keystore (Strictly from GitHub Secrets)
        if: ${{ inputs.build_type == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::[Signing Policy Error] ANDROID_KEYSTORE_BASE64 secret is not configured in GitHub Secrets."
            echo "::error::Automated fallback key generation is disabled by policy. Please configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::[Signing Policy Error] Missing keystore credentials. Please provide ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Secrets."
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const raw = (process.env.ANDROID_KEYSTORE_BASE64 || '').replace(/[\r\n\s]/g, '');
            const buf = Buffer.from(raw, 'base64');
            fs.writeFileSync('android/app/release-keystore.jks', buf);
          "
          if [ ! -s android/app/release-keystore.jks ]; then
            echo "::error::[Signing Policy Error] Failed to decode ANDROID_KEYSTORE_BASE64 into release-keystore.jks or file is empty."
            exit 1
          fi
          echo "✅ Verified official user keystore: release-keystore.jks ($(wc -c < android/app/release-keystore.jks) bytes)"
          echo "ANDROID_KEYSTORE_PATH=release-keystore.jks" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" >> $GITHUB_ENV

      - name: Build Signed Android APK via Gradle
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          if [ "${{ inputs.build_type }}" = "release" ]; then
            echo "Building officially signed Store Release APK (assembleStoreRelease)..."
            ./gradlew assembleStoreRelease --no-daemon --stacktrace
          else
            echo "Building Store Debug APK (assembleStoreDebug)..."
            ./gradlew assembleStoreDebug --no-daemon --stacktrace
          fi

      - name: Verify APK Asset Hygiene (Fail on Web Leaks or Forbidden Artifacts)
        run: |
          APK_FILES=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null || true)
          if [ -z "$APK_FILES" ]; then
            echo "::error::No APK files found to verify!"
            exit 1
          fi

          for apk in $APK_FILES; do
            echo "Verifying asset hygiene for: $apk"
            LISTING=$(unzip -l "$apk")

            # Check forbidden files
            FORBIDDEN_FILES="server.cjs sw.js 404.html sitemap.xml screenshot-"
            for pattern in $FORBIDDEN_FILES; do
              if echo "$LISTING" | grep -E "assets/public/.*$pattern"; then
                echo "::error::[Asset Hygiene Failure] Found forbidden asset ($pattern) inside $apk"
                exit 1
              fi
            done

            # Check forbidden sourcemap files
            if echo "$LISTING" | grep -E "assets/public/.*\.map"; then
              echo "::error::[Asset Hygiene Failure] Found forbidden .map file inside $apk"
              exit 1
            fi

            # Check forbidden strings in web assets
            TMP_DIR=$(mktemp -d)
            unzip -q "$apk" "assets/public/*" -d "$TMP_DIR" 2>/dev/null || true
            if [ -d "$TMP_DIR/assets/public" ]; then
              if grep -rnE "cdn\.jsdelivr\.net|api\.qrserver\.com|your-backend-api\.com" "$TMP_DIR/assets/public"; then
                echo "::error::[Asset Hygiene Failure] Found forbidden third-party domain in web assets inside $apk"
                rm -rf "$TMP_DIR"
                exit 1
              fi
            fi
            rm -rf "$TMP_DIR"
            echo "✅ Asset hygiene check passed for $apk"
          done

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: warraich-goods-driver-dost-signed-apk-${{ inputs.build_type }}
          path: |
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
