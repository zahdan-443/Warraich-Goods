name: Android APK Build & Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE24: "true"
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          validate-wrappers: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install NPM Dependencies
        run: |
          npm ci || npm install --no-audit --no-fund

      - name: Run Test Suite
        run: |
          npm run test

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android
          # Safety cleanup: remove any obsolete or duplicate MainActivity files outside official package
          find android/app/src/main/java -name "MainActivity.java" ! -path "*/com/warraichgoods/driverdost/*" -delete || true
          # Safety cleanup: remove any corrupt/non-standard land-hdpi splash that can fail aapt2 compilation
          rm -rf android/app/src/main/res/drawable-land-hdpi || true

      - name: Inject google-services.json (if provided via GitHub Secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "✅ Successfully configured android/app/google-services.json from GitHub Secrets"
          elif [ -f "android/app/google-services.json" ]; then
            echo "✅ android/app/google-services.json exists in workspace"
          else
            echo "⚠️ Notice: google-services.json not found in repository or secrets. Place it at android/app/google-services.json or add GOOGLE_SERVICES_JSON secret."
          fi

      - name: Prepare Release Keystore (Secrets or Auto-Generate)
        if: ${{ inputs.build_type == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using custom Release Keystore from GitHub Secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/release-keystore.jks
            echo "Decoded release-keystore.jks ($(wc -c < android/app/release-keystore.jks) bytes)"
            echo "ANDROID_KEYSTORE_PATH=release-keystore.jks" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" >> $GITHUB_ENV
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret was not provided or empty. Generating temporary release key on the fly..."
            KEY_PW="${ANDROID_KEYSTORE_PASSWORD:-DriverDostWarraich2026}"
            KEY_AL="${ANDROID_KEY_ALIAS:-driverdost}"
            keytool -genkeypair -v \
              -keystore android/app/release-keystore.jks \
              -alias "$KEY_AL" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEY_PW" \
              -keypass "$KEY_PW" \
              -dname "CN=Driver Dost, OU=Warraich Goods Transport Company, O=Warraich Goods, L=Gujranwala, ST=Punjab, C=PK"

            echo "ANDROID_KEYSTORE_PATH=release-keystore.jks" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$KEY_PW" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$KEY_AL" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$KEY_PW" >> $GITHUB_ENV
          fi

      - name: Print Keystore Fingerprints (SHA-1 & SHA-256 for Firebase)
        if: ${{ inputs.build_type == 'release' }}
        run: |
          echo "=== Release Keystore Fingerprints (Add both SHA-1 and SHA-256 to Firebase Console) ==="
          keytool -list -v -keystore "android/app/$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | grep -E "SHA1:|SHA256:" || echo "Could not read Keystore fingerprint"
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Build Android APK via Gradle
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ "${{ inputs.build_type }}" = "release" ]; then
            echo "Building officially signed Release APK..."
            gradle assembleRelease --no-daemon
          else
            echo "Building Debug APK..."
            gradle assembleDebug --no-daemon
          fi

      - name: Verify APK Signature Matches Expected Keystore
        if: ${{ inputs.build_type == 'release' }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Checking signature of: $APK_PATH"
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          echo "=== APK's actual signing certificate (from the built APK itself) ==="
          "$APKSIGNER" verify --print-certs "$APK_PATH" | grep -i "SHA-256"
          echo "=== Keystore's certificate (from the decoded secret file, for comparison) ==="
          keytool -list -v -keystore "android/app/$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | grep "SHA256:"
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: warraich-goods-driver-dost-apk-${{ inputs.build_type }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
