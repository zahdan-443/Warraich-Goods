name: Android APK Build & Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE24: "true"
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          validate-wrappers: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install NPM Dependencies
        run: |
          npm ci || npm install --no-audit --no-fund

      - name: Run Test Suite
        run: |
          npm run test

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android
          # Safety cleanup: remove any obsolete or duplicate MainActivity files outside official package
          find android/app/src/main/java -name "MainActivity.java" ! -path "*/com/warraichgoods/driverdost/*" -delete || true
          # Safety cleanup: remove any corrupt/non-standard land-hdpi splash that can fail aapt2 compilation
          rm -rf android/app/src/main/res/drawable-land-hdpi || true

      - name: Prepare Release Keystores (Secrets or Auto-Generate)
        if: ${{ inputs.build_type == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_LEGACY_BASE64: ${{ secrets.ANDROID_KEYSTORE_LEGACY_BASE64 }}
          ANDROID_KEYSTORE_LEGACY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_LEGACY_PASSWORD }}
          ANDROID_KEY_LEGACY_ALIAS: ${{ secrets.ANDROID_KEY_LEGACY_ALIAS }}
          ANDROID_KEY_LEGACY_PASSWORD: ${{ secrets.ANDROID_KEY_LEGACY_PASSWORD }}
        run: |
          # 1. Modern Keystore (com.warraichgoods.driverdost)
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using custom Modern Keystore from GitHub Secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/release-keystore.jks
            echo "Decoded release-keystore.jks ($(wc -c < android/app/release-keystore.jks) bytes)"
            echo "ANDROID_KEYSTORE_PATH=release-keystore.jks" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" >> $GITHUB_ENV
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret was not provided or empty. Generating temporary release key on the fly..."
            KEY_PW="${ANDROID_KEYSTORE_PASSWORD:-DriverDostWarraich2026}"
            KEY_AL="${ANDROID_KEY_ALIAS:-driverdost}"
            keytool -genkeypair -v \
              -keystore android/app/release-keystore.jks \
              -alias "$KEY_AL" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEY_PW" \
              -keypass "$KEY_PW" \
              -dname "CN=Driver Dost, OU=Warraich Goods Transport Company, O=Warraich Goods, L=Gujranwala, ST=Punjab, C=PK"

            echo "ANDROID_KEYSTORE_PATH=release-keystore.jks" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=$KEY_PW" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$KEY_AL" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$KEY_PW" >> $GITHUB_ENV
          fi

          # 2. Legacy Keystore (io.github.zahdan_443.twa - temporary Palm Store flavor)
          # If user supplied ANDROID_KEYSTORE_LEGACY_BASE64 (or pasted Modern keystore into it), use it;
          # Fall back to main ANDROID_KEYSTORE_* credentials so it works seamlessly with the same keystore/password/alias.
          LEGACY_B64="${ANDROID_KEYSTORE_LEGACY_BASE64:-$ANDROID_KEYSTORE_BASE64}"
          LEGACY_PW="${ANDROID_KEYSTORE_LEGACY_PASSWORD:-${ANDROID_KEYSTORE_PASSWORD:-DriverDostWarraich2026}}"
          LEGACY_AL="${ANDROID_KEY_LEGACY_ALIAS:-${ANDROID_KEY_ALIAS:-driverdost}}"
          LEGACY_KP="${ANDROID_KEY_LEGACY_PASSWORD:-${ANDROID_KEY_PASSWORD:-$LEGACY_PW}}"

          if [ -n "$LEGACY_B64" ]; then
            echo "Using custom Legacy Keystore from GitHub Secrets..."
            echo "$LEGACY_B64" | tr -d '\r\n ' | base64 -d > android/app/legacy-keystore.jks
            echo "Decoded legacy-keystore.jks ($(wc -c < android/app/legacy-keystore.jks) bytes)"
            echo "ANDROID_KEYSTORE_LEGACY_PATH=legacy-keystore.jks" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_LEGACY_PASSWORD=$LEGACY_PW" >> $GITHUB_ENV
            echo "ANDROID_KEY_LEGACY_ALIAS=$LEGACY_AL" >> $GITHUB_ENV
            echo "ANDROID_KEY_LEGACY_PASSWORD=$LEGACY_KP" >> $GITHUB_ENV
          else
            echo "::warning::No keystore base64 provided for legacy. Generating legacy key on the fly..."
            keytool -genkeypair -v \
              -keystore android/app/legacy-keystore.jks \
              -alias "$LEGACY_AL" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$LEGACY_PW" \
              -keypass "$LEGACY_KP" \
              -dname "CN=Driver Dost Legacy, OU=Warraich Goods Transport Company, O=Warraich Goods, L=Gujranwala, ST=Punjab, C=PK"

            echo "ANDROID_KEYSTORE_LEGACY_PATH=legacy-keystore.jks" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_LEGACY_PASSWORD=$LEGACY_PW" >> $GITHUB_ENV
            echo "ANDROID_KEY_LEGACY_ALIAS=$LEGACY_AL" >> $GITHUB_ENV
            echo "ANDROID_KEY_LEGACY_PASSWORD=$LEGACY_KP" >> $GITHUB_ENV
          fi

      - name: Print Keystore Fingerprints (diagnostic only, no secrets exposed)
        if: ${{ inputs.build_type == 'release' }}
        run: |
          echo "=== Modern keystore fingerprint ==="
          keytool -list -v -keystore "android/app/$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | grep "SHA256:" || echo "Could not read Modern Keystore fingerprint"
          echo "=== Legacy keystore fingerprint ==="
          keytool -list -v -keystore "android/app/$ANDROID_KEYSTORE_LEGACY_PATH" -storepass "$ANDROID_KEYSTORE_LEGACY_PASSWORD" 2>/dev/null | grep "SHA256:" || echo "Could not read Legacy Keystore fingerprint"
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_LEGACY_PATH: ${{ env.ANDROID_KEYSTORE_LEGACY_PATH }}
          ANDROID_KEYSTORE_LEGACY_PASSWORD: ${{ env.ANDROID_KEYSTORE_LEGACY_PASSWORD || secrets.ANDROID_KEYSTORE_LEGACY_PASSWORD }}

      - name: Build Android APK via Gradle
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_LEGACY_PATH: ${{ env.ANDROID_KEYSTORE_LEGACY_PATH }}
          ANDROID_KEYSTORE_LEGACY_PASSWORD: ${{ env.ANDROID_KEYSTORE_LEGACY_PASSWORD || secrets.ANDROID_KEYSTORE_LEGACY_PASSWORD }}
          ANDROID_KEY_LEGACY_ALIAS: ${{ env.ANDROID_KEY_LEGACY_ALIAS || secrets.ANDROID_KEY_LEGACY_ALIAS }}
          ANDROID_KEY_LEGACY_PASSWORD: ${{ env.ANDROID_KEY_LEGACY_PASSWORD || secrets.ANDROID_KEY_LEGACY_PASSWORD }}
        run: |
          cd android
          if [ "${{ inputs.build_type }}" = "release" ]; then
            echo "Building officially signed Modern and Legacy Release APKs..."
            gradle assembleModernRelease assembleLegacyRelease --no-daemon
          else
            echo "Building Debug APKs for Modern and Legacy flavors..."
            gradle assembleModernDebug assembleLegacyDebug --no-daemon
          fi

      - name: Upload Modern APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: warraich-goods-apk-modern-${{ inputs.build_type }}
          path: |
            android/app/build/outputs/apk/modern/release/*.apk
            android/app/build/outputs/apk/modern/debug/*.apk
          retention-days: 14

      - name: Upload Legacy APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: warraich-goods-apk-legacy-${{ inputs.build_type }}
          path: |
            android/app/build/outputs/apk/legacy/release/*.apk
            android/app/build/outputs/apk/legacy/debug/*.apk
          retention-days: 14
