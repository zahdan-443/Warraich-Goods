import groovy.json.JsonSlurper

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def packageJsonFile = file('../../package.json')
def packageJson = packageJsonFile.exists() ? new JsonSlurper().parseText(packageJsonFile.text) : null
def appVersionName = packageJson?.version ?: "1.2.1"
def versionParts = appVersionName.tokenize('.')
def computedVersionCode = ((versionParts.size() > 0 ? versionParts[0].toInteger() : 0) * 10000) + 
                          ((versionParts.size() > 1 ? versionParts[1].toInteger() : 0) * 100) + 
                          (versionParts.size() > 2 ? versionParts[2].toInteger() : 0)
def appVersionCode = Math.max(computedVersionCode, 6)

android {
    namespace = "com.warraichgoods.driverdost"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.warraichgoods.driverdost"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH") ?: project.findProperty("RELEASE_STORE_FILE") ?: "release-keystore.jks"
            def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: project.findProperty("RELEASE_STORE_PASSWORD")
            def keyAliasVal = System.getenv("ANDROID_KEY_ALIAS") ?: project.findProperty("RELEASE_KEY_ALIAS")
            def keyPasswordVal = System.getenv("ANDROID_KEY_PASSWORD") ?: project.findProperty("RELEASE_KEY_PASSWORD")

            def kFile = keystorePath ? (file(keystorePath).exists() ? file(keystorePath) : (rootProject.file(keystorePath).exists() ? rootProject.file(keystorePath) : null)) : null
            if (kFile && keystorePassword && keyAliasVal && keyPasswordVal) {
                storeFile kFile
                storePassword keystorePassword
                keyAlias keyAliasVal
                keyPassword keyPasswordVal
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    // Fix resource merging issues
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE'
            ]
        }
    }
}

// Repositories are provided by allprojects in root build.gradle (google, mavenCentral).
// Local JAR dependencies are handled directly by fileTree(include: ['*.jar'], dir: 'libs').

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // CameraX & Background Lifecycle dependencies for Dashcam (Adapted from xxxifan/DashCam)
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"
    // Firebase Authentication & Google Play Services Auth
    implementation "com.google.firebase:firebase-auth:24.0.1"
    implementation "com.google.android.gms:play-services-auth:20.7.0"
    implementation "androidx.credentials:credentials:1.2.0-rc01"
    implementation "androidx.credentials:credentials-play-services-auth:1.2.0-rc01"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.0"
}

apply from: 'capacitor.build.gradle'

if (file('google-services.json').exists() || file('src/release/google-services.json').exists() || file('src/debug/google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

