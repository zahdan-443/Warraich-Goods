import groovy.json.JsonSlurper

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def packageJsonFile = file('../../package.json')
def packageJson = packageJsonFile.exists() ? new JsonSlurper().parseText(packageJsonFile.text) : null
def appVersionName = packageJson?.version ?: "1.2.4"
def versionParts = appVersionName.tokenize('.')
def computedVersionCode = ((versionParts.size() > 0 ? versionParts[0].toInteger() : 0) * 10000) + 
                          ((versionParts.size() > 1 ? versionParts[1].toInteger() : 0) * 100) + 
                          (versionParts.size() > 2 ? versionParts[2].toInteger() : 0)
def appVersionCode = Math.max(computedVersionCode, 9)

android {
    namespace = "com.warraichgoods.driverdost"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.warraichgoods.driverdost"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:server.cjs*:sw.js*:registerSW.js:404.html:sitemap.xml:robots.txt:screenshot*.png:*.map:aistudio*'
    }

    flavorDimensions = ["distribution"]
    productFlavors {
        store {
            dimension "distribution"
        }
        full {
            dimension "distribution"
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH") ?: project.findProperty("RELEASE_STORE_FILE") ?: "release-keystore.jks"
            def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: project.findProperty("RELEASE_STORE_PASSWORD")
            def keyAliasVal = System.getenv("ANDROID_KEY_ALIAS") ?: project.findProperty("RELEASE_KEY_ALIAS") ?: "driverdost"
            def keyPasswordVal = System.getenv("ANDROID_KEY_PASSWORD") ?: project.findProperty("RELEASE_KEY_PASSWORD")

            def kFile = keystorePath ? (file(keystorePath).exists() ? file(keystorePath) : (rootProject.file(keystorePath).exists() ? rootProject.file(keystorePath) : null)) : null
            def isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
            if (kFile && keystorePassword && keyAliasVal && keyPasswordVal) {
                storeFile kFile
                storePassword keystorePassword
                keyAlias keyAliasVal
                keyPassword keyPasswordVal
                v1SigningEnabled true
                v2SigningEnabled true
            } else if (isReleaseTask) {
                throw new GradleException("[Signing Policy] Release APK build requires official keystore credentials (ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Fallback or automatic generation is disabled.")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    // Exclude unwanted diagnostic files, sourcemaps and metadata from APK
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/*.kotlin_module',
                'META-INF/INDEX.LIST',
                '**/aistudio/**',
                '**/*.map'
            ]
        }
    }
}

// Repositories are provided by allprojects in root build.gradle (google, mavenCentral).
// Local JAR dependencies are handled directly by fileTree(include: ['*.jar'], dir: 'libs').

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase Authentication & Google Play Services Auth
    implementation "com.google.firebase:firebase-auth:24.0.1"
    implementation "com.google.android.gms:play-services-auth:20.7.0"
    implementation "androidx.credentials:credentials:1.2.0-rc01"
    implementation "androidx.credentials:credentials-play-services-auth:1.2.0-rc01"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.0"

    // Full flavor exclusive: CameraX continuous road video recording (Zero impact on store flavor)
    def cameraXVersion = "1.4.1"
    fullImplementation "androidx.camera:camera-core:${cameraXVersion}"
    fullImplementation "androidx.camera:camera-camera2:${cameraXVersion}"
    fullImplementation "androidx.camera:camera-lifecycle:${cameraXVersion}"
    fullImplementation "androidx.camera:camera-video:${cameraXVersion}"
}

apply from: 'capacitor.build.gradle'

if (file('google-services.json').exists() || file('src/release/google-services.json').exists() || file('src/debug/google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

